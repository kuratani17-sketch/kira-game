<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>キラゲームDX</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;color:#f4f4f8;background:#10121a}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top left,#292340,#10121a 65%)}button,input,select{font:inherit}button{cursor:pointer;color:white;border:1px solid #494968;border-radius:10px;background:#37334f;padding:10px 14px}button:hover:not(:disabled){background:#504667}button:disabled{opacity:.4;cursor:not-allowed}input,select{border:1px solid #52506b;background:#171826;color:white;padding:10px;border-radius:8px;min-width:0;width:100%}label{display:block;font-size:.86rem;color:#c0bfd2;margin:9px 0 5px}.wrap{max-width:1180px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.brand{font-weight:900;letter-spacing:.12em;font-size:clamp(1.5rem,4vw,2.4rem)}.brand b{color:#ff5a77} .subtitle{color:#aaa8c1}.panel{background:#1b1c2be8;border:1px solid #343347;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 8px 30px #0002}.columns{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,1fr);gap:14px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.primary{background:#b12c50;border-color:#dd416a;font-weight:800}.primary:hover:not(:disabled){background:#ce3b62}.secondary{background:#234a64}.hidden{display:none!important}.muted{color:#a6a5bc;font-size:.87rem}.badge{display:inline-block;padding:5px 9px;border-radius:9px;background:#37364f;font-size:.8rem}.status{color:#ffcf78}.players{display:grid;gap:8px}.person{border:1px solid #45435a;background:#242436;border-radius:10px;padding:12px;display:flex;justify-content:space-between;align-items:center;gap:9px}.person.dead{opacity:.46}.name{font-weight:700}.sus{font-size:1.5rem;font-weight:900;color:#ffcf78}.meter{height:5px;background:#454052;border-radius:6px;margin-top:8px;overflow:hidden}.meter:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:#c7c0d6}.meter{position:relative;height:8px}.meter span{display:block;position:absolute;height:100%;border-radius:5px}.meter span.positive{background:linear-gradient(90deg,#ffcf78,#ff866c)}.meter span.negative{background:linear-gradient(90deg,#5197ec,#77d3e6)}.history{max-height:300px;overflow:auto;background:#11121e;border-radius:10px;padding:9px}.history div{border-bottom:1px solid #292937;padding:7px;font-size:.85rem}.clock{font-weight:900;font-size:2rem;color:#ffcf78}.role{font-size:1.7rem;font-weight:900;color:#f4f4f8}.faction-kira{color:#ff617b!important}.faction-l{color:#64aeff!important}.active{border:2px solid #df4773}.notice{position:fixed;z-index:20;inset:0;background:#090912d9;display:flex;align-items:center;justify-content:center;padding:20px}.noticeBox{text-align:center;background:#242032;border:2px solid #ff7391;border-radius:22px;padding:35px 24px;max-width:650px;width:100%;box-shadow:0 0 100px #ff336633}.noticeBox h1{font-size:clamp(2rem,7vw,4rem);margin:8px 0}.noticeBox.faction-kira{border-color:#ff617b}.noticeBox.faction-l{border-color:#64aeff}.noticeBox p{font-size:1.15rem}.choice{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.choice button{flex:1}.selected{background:#a93655!important;border-color:#ff93b1!important}.tip{background:#28243b;border-left:3px solid #ed5d83;border-radius:5px;padding:10px;font-size:.85rem}.small{font-size:.8rem}.full{width:100%}@media(max-width:750px){.columns,.two,.three{grid-template-columns:1fr}.wrap{padding:10px}.panel{padding:14px}.brand{font-size:1.5rem}}
</style></head><body><div class="wrap"><div class="top"><div><div class="brand">キラゲーム <b>DX</b></div><div class="subtitle">正体を隠せ。疑惑を操れ。</div></div><div id="connection" class="badge">未接続</div></div>
<section id="entry" class="panel"><h2>部屋を作成 / 参加</h2><label>あなたの表示名</label><input id="nickname" maxlength="20" placeholder="プレイヤー"><div class="two"><div><label>部屋コード（新規作成なら空欄）</label><input id="roomcode" maxlength="6" placeholder="ABC123"></div><div style="display:flex;align-items:end"><button id="join" class="primary full">入室する</button></div></div><p class="muted">5〜12人対戦。人間1人からOK、残りの枠はNPCが埋めます。複数端末なら同じ部屋コードで参加してください。</p></section>
<section id="lobby" class="panel hidden"><h2>待機部屋 <span id="code" class="status"></span></h2><p id="lobbyPeople"></p><div id="hostSettings"><h3>ゲーム設定</h3><div class="three"><div><label>全体人数</label><input type="number" id="size" min="5" max="12" value="5"></div><div><label>崇拝者の人数</label><input type="number" id="follower" min="0" value="1"></div><div><label>ワタリの人数</label><input type="number" id="watari" min="0" value="0"></div><div><label>ジェバンニの人数</label><input type="number" id="gevanni" min="0" value="0"></div><div><label>議論時間（秒）</label><input type="number" id="discussion" min="15" value="90"></div><div><label>夜時間（秒）</label><input type="number" id="night" min="10" value="30"></div></div><p id="remainder" class="muted"></p><p class="muted">キラ・Lは各1人固定。残りは捜査員になります。※ 捜査員が0人の場合は開始できません。</p><button id="save">設定を保存</button> <button id="start" class="primary">ゲーム開始</button></div><p id="guestHelp" class="hidden muted">ホストがゲームを開始するまで待機してください。</p><p><button id="copy">招待用リンクをコピー</button></p></section>
<div id="game" class="hidden"><div class="panel"><div class="top"><div><div id="phase" style="font-size:1.4rem;font-weight:900"></div><div id="round" class="muted"></div></div><div style="text-align:right"><div id="clock" class="clock">--</div></div></div><hr style="border:0;border-top:1px solid #353249"><div id="discussionControls" class="hidden" style="margin-top:14px"><button id="endDiscussion" class="secondary">議論を終了して指名へ進む</button><p class="muted">ホストのみ手動で議論を終了できます。</p></div><div class="two"><div><div class="muted">あなたの役職</div><div id="myRole" class="role"></div><div id="myPower" class="muted"></div></div><div><div id="known" class="tip"></div></div></div></div>
<div class="columns"><div><section class="panel"><h2>生存者・疑惑度</h2><div id="players" class="players"></div></section><section class="panel" id="actionPanel"><h2 id="actionTitle">行動</h2><p id="actionHelp" class="muted"></p><div id="actionChoices"></div><div id="deltaChoices" class="choice hidden"><button data-delta="1" class="selected">疑惑度 ＋1</button><button data-delta="-1">疑惑度 −1</button></div><button id="submitAction" class="primary full hidden">行動を確定する</button><button id="skipNight" class="secondary full hidden" style="margin-top:8px">今夜は裁きを使わない</button></section></div><div><section class="panel"><h2>【公開情報】</h2><div id="publicInfo" class="history"><div class="muted">まだ公開情報はありません</div></div></section><section class="panel"><h2>公開履歴</h2><div id="history" class="history"></div></section><section class="panel"><h2>調査記録</h2><div id="investigations" class="muted">まだ調査結果はありません</div></section></div></div></div>
<div id="overlay" class="notice hidden"><div id="overlayBox" class="noticeBox"><div id="overlayKind" class="status"></div><h1 id="overlayTitle"></h1><p id="overlaySub"></p><div id="overlayEnd"></div><button id="dismiss">閉じる</button></div></div>
<div id="toast" style="position:fixed;bottom:15px;left:15px;background:#663248;padding:10px;border-radius:8px;display:none;z-index:40"></div>
</div><script>
const $=id=>document.getElementById(id), names={kira:'キラ',follower:'崇拝者',l:'L',investigator:'捜査員',watari:'ワタリ',gevanni:'ジェバンニ'};
let ws,S=null,token=null,selected=null,delta=1,seenReveal='';
function faction(role){return role==='kira'||role==='follower'?'faction-kira':role==='l'||role==='investigator'||role==='watari'||role==='gevanni'?'faction-l':''}
function safe(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',3600)}
function send(o){if(ws?.readyState===1)ws.send(JSON.stringify(o));else toast('接続されていません')}
function enter(){const name=$('nickname').value.trim()||'プレイヤー',code=$('roomcode').value.trim().toUpperCase();const protocol=location.protocol==='https:'?'wss:':'ws:';ws=new WebSocket(protocol+'//'+location.host+'/ws');$('connection').textContent='接続中';ws.onopen=()=>send({type:'join',name,code,token:code===sessionStorage.getItem('dx_code')?sessionStorage.getItem('dx_token'):''});ws.onmessage=async ev=>{let m=JSON.parse(ev.data);if(m.type==='error')toast(m.message);if(m.type==='joined'){token=m.token;sessionStorage.setItem('dx_code',m.code);sessionStorage.setItem('dx_token',m.token);$('roomcode').value=m.code;$('connection').textContent='接続中：'+m.code;}if(m.type==='state'){S=m.data;render()}};ws.onclose=()=>{$('connection').textContent='切断';if(S&&S.stage!=='ended')toast('回線切断。ページ更新で再接続してください')}}
$('join').onclick=enter;
$('endDiscussion').onclick=()=>{if(S?.stage==='discussion'&&S.host)send({type:'end_discussion'})};
const fieldIds=['size','follower','watari','gevanni','discussion','night'];function opts(){return Object.fromEntries(fieldIds.map(id=>[id,Number($(id).value)]))}
function rest(){let o=opts();$('remainder').textContent=`捜査員：${o.size-2-o.follower-o.watari-o.gevanni}人`}
fieldIds.forEach(x=>$(x).oninput=rest);rest();$('save').onclick=()=>send({type:'config',options:opts()});$('start').onclick=()=>send({type:'start'});
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(location.origin+'/?room='+S.code);toast('招待URLをコピーしました')}catch(e){toast('招待URL：'+location.origin+'/?room='+S.code)}};
$('dismiss').onclick=()=>{$('overlay').classList.add('hidden');if(S?.stage==='ended')showOverlay()};
let overlayDismissed='';function showOverlay(){const r=S.reveal;if(!r)return;const key=JSON.stringify(r)+S.day+S.round;if(overlayDismissed===key)return;if(seenReveal!==key){seenReveal=key;$('overlay').classList.remove('hidden');$('overlayKind').textContent=r.kind==='win'?'GAME OVER':r.kind==='arrest'?'検挙':r.kind==='judgment'?'夜の結果':'指名結果';$('overlayTitle').textContent=r.text;$('overlaySub').textContent=r.sub;$('overlayBox').className='noticeBox '+(r.team==='kira'?'faction-kira':r.team==='l'?'faction-l':'');$('overlayTitle').className=r.team==='kira'?'faction-kira':r.team==='l'?'faction-l':'';$('overlaySub').className=r.team==='kira'?'faction-kira':r.team==='l'?'faction-l':'';$('overlayEnd').innerHTML=r.kind==='win'&&S.host?'<button id="restart" class="primary">待機部屋に戻る</button>':'';if($('restart'))$('restart').onclick=()=>send({type:'return'});} }
$('dismiss').addEventListener('click',()=>{overlayDismissed=seenReveal});
function render(){if(!S)return;$('entry').classList.add('hidden');$('lobby').classList.toggle('hidden',S.stage!=='lobby');$('game').classList.toggle('hidden',S.stage==='lobby');$('code').textContent=S.code;
if(S.stage==='lobby'){$('lobbyPeople').textContent='参加中：'+S.players.map(p=>p.name).join('、')+'（'+S.players.length+'人）';$('hostSettings').classList.toggle('hidden',!S.host);$('guestHelp').classList.toggle('hidden',S.host);fieldIds.forEach(id=>{if(document.activeElement!==$(id))$(id).value=S.options[id]});rest();return}
$('phase').textContent=({discussion:'議論',nomination:'指名',night:'夜の行動',result:'結果発表',ended:'ゲーム終了'})[S.stage];$('round').textContent=`${S.day}日目 ／ ${S.round}回目 / 3回`;
$('discussionControls').classList.toggle('hidden',!(S.stage==='discussion'&&S.host));
$('myRole').textContent=names[S.myRole]||'不明';$('myRole').className='role '+faction(S.myRole);$('myPower').textContent=({kira:'裁き：夜に1人を脱落させる',follower:'ゲーム開始時にキラの正体を知る',l:'調査：夜に1人の正体を確認する',investigator:'特殊能力なし',watari:'ゲーム開始時にLの正体を知る',gevanni:'一晩でやる：夜に1人を守る（連夜同一対象不可）'})[S.myRole];$('known').innerHTML=S.known.length?'既知の人物：'+S.known.map(id=>`<span class="${S.myRole==='follower'?'faction-kira':'faction-l'}">${S.myRole==='follower'?'キラ':'L'}：${safe(S.players.find(x=>x.id===id)?.name)}</span>`).join('、'):'他プレイヤーの役職は非公開';
const susScale=Math.max(1,...S.players.map(p=>Math.abs(p.suspicion)));
$('players').innerHTML=S.players.map(p=>{
  const v=p.suspicion, width=50*Math.abs(v)/susScale, left=v<0?50-width:50;
  return `<div class="person ${p.alive?'':'dead'}"><div style="flex:1"><div class="name">${safe(p.name)} ${p.id===S.self?'（あなた）':''} ${p.npc?'🤖':''} ${p.alive?'':'【脱落】'}</div><div class="muted">${p.role?`<span class="${faction(p.role)}">${names[p.role]}</span> ／ `:''}疑惑度 ${v}</div><div class="meter"><span class="${v<0?'negative':'positive'}" style="left:${left}%;width:${width}%"></span></div></div><div class="sus">${v}</div></div>`
}).join('');
$('publicInfo').innerHTML=S.publicInfo?.length?S.publicInfo.slice().reverse().map(x=>`<div><strong>${safe(x.day)}日目</strong>：${safe(x.text)}</div>`).join(''):'<div class="muted">まだ公開情報はありません</div>';
$('history').innerHTML=S.log.slice().reverse().map(x=>'<div>'+safe(x)+'</div>').join('');$('investigations').innerHTML=S.investigations.length?S.investigations.map(i=>`<div>${safe(i.name)}：${i.result?'キラである':'キラではない'}</div>`).join(''):'まだ調査結果はありません';
renderActions();showOverlay();}
function renderActions(){const a=$('actionPanel');const usable=S.players.find(x=>x.id===S.self)?.alive&&!S.hasActed;const isNom=S.stage==='nomination';const isNight=S.stage==='night';a.classList.toggle('hidden',!isNom&&!isNight);if(!isNom&&!isNight)return;
const power=['kira','l','gevanni'].includes(S.myRole);$('actionTitle').textContent=isNom?'指名する':power?'夜の能力':'夜の待機';$('actionHelp').textContent=S.hasActed?'行動確定済み。他のプレイヤーを待っています':isNom?'対象と疑惑度の増減を選択してください。全員の指名は同時公開されます。':power?'夜の対象を選んでください。':'夜の行動はありません。待機を確定してください。';
$('deltaChoices').classList.toggle('hidden',!isNom);$('submitAction').classList.toggle('hidden',!usable);$('skipNight').classList.toggle('hidden',!(usable&&isNight&&S.myRole==='kira'));$('actionChoices').innerHTML='';if(!usable)return;
const arr=power||isNom?S.players.filter(p=>p.alive&&(p.id!==S.self||isNight&&S.myRole==='gevanni')&&!(isNight&&S.myRole==='gevanni'&&p.id===S.lastGuard)):[];
if(!arr.length){selected=null}else if(!arr.some(p=>p.id===selected))selected=null;
for(const p of arr){const b=document.createElement('button');b.textContent=p.name;b.className=selected===p.id?'selected':'';b.style.margin='4px';b.onclick=()=>{selected=p.id;renderActions()};$('actionChoices').append(b)}
$('submitAction').disabled=(power||isNom)&&!selected;$('submitAction').textContent=isNom?'指名を確定':power?'能力を使用':'待機を確定';}
document.querySelectorAll('[data-delta]').forEach(b=>b.onclick=()=>{delta=Number(b.dataset.delta);document.querySelectorAll('[data-delta]').forEach(x=>x.classList.toggle('selected',x===b))});
$('submitAction').onclick=()=>{if(S.stage==='nomination')send({type:'nominate',target:selected,delta});if(S.stage==='night')send({type:'night',target:selected});selected=null};
$('skipNight').onclick=()=>{if(S.stage==='night'&&S.myRole==='kira')send({type:'night',pass:true});selected=null};setInterval(()=>{if(S?.deadline){$('clock').textContent=Math.max(0,Math.ceil(S.deadline-Date.now()/1000))+'秒'}else $('clock').textContent='--'},250);
const roomFromUrl=new URLSearchParams(location.search).get('room');if(roomFromUrl)$('roomcode').value=roomFromUrl.toUpperCase();
</script></body></html>
